plugins {
	id 'eclipse'
	id 'idea'
	id 'net.minecraftforge.gradle' version '[6.0,6.2)'
	id 'org.spongepowered.mixin' version '0.7.+'
	id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '1.20.1-0.1.2'
group = 'com.builtbroken.cardboardboxes'

base {
	archivesName = 'cardboardboxes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

minecraft {
	mappings channel: 'parchment', version: '2023.09.03-1.20.1'
	copyIdeResources = true

    runs {
        client {
            properties 'forge.logging.console.level': 'debug'
            workingDirectory project.file('run/client')
            source sourceSets.main
        }
        server {
            properties 'forge.logging.console.level': 'debug'
            args '-nogui'
            workingDirectory project.file('run/server')
            source sourceSets.main
        }
        data {
            properties 'forge.logging.console.level': 'debug'
			args '--mod', 'cardboardboxes', '--all', '--output', file('src/generated/resources/')
            workingDirectory project.file('run/data')
            source sourceSets.main
        }
    }
}

dependencies {
	minecraft 'net.minecraftforge:forge:1.20.1-47.1.3'
}

tasks.named('jar', Jar).configure {
	exclude('com/builtbroken/cardboardboxes/datagen/**') //exclude files from the built jar that are only used to generate the assets & data
    from('/') {
        include 'LICENSE.txt'
    }
    manifest.attributes([
            "Specification-Title": archivesBaseName,
            "Specification-Vendor": "builtbroken",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": archivesBaseName,
            "Implementation-Version": version,
            "Implementation-Vendor": "builtbroken"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}