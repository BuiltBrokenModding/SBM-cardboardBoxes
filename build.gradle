plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
	id 'net.neoforged.moddev' version '2.0.82'
}

version = '1.21.5-0.1.2'
group = 'com.builtbroken.cardboardboxes'

base {
	archivesName = 'cardboardboxes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

neoForge {
	version = "21.6.0-beta"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("run/" + name)
			ideName = "SBMCardboardBoxes " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}

		data {
			clientData()
			programArguments.addAll('--mod', 'cardboardboxes', '--all', '--output', file('src/generated/resources/').getAbsolutePath())
		}
	}

	mods {
		cardboardboxes {
			sourceSet(sourceSets.main)
		}
	}
}

tasks.named('jar', Jar).configure {
	exclude('com/builtbroken/cardboardboxes/datagen/**') //exclude files from the built jar that are only used to generate the assets & data
    from('/') {
        include 'LICENSE.txt'
    }
    manifest.attributes([
            "Specification-Title": archivesBaseName,
            "Specification-Vendor": "builtbroken",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": archivesBaseName,
            "Implementation-Version": version,
            "Implementation-Vendor": "builtbroken"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}