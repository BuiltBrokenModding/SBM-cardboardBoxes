plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.0.105'
}

version = '1.20.6-0.1.1'
group = 'com.builtbroken.cardboardboxes'

base {
	archivesName = 'cardboardboxes'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

processResources {
	exclude ".cache"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources' //include generated files
}

runs {
    configureEach {
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        workingDirectory project.file('run/client')
    }

    server {
        workingDirectory project.file('run/server')
        programArgument '-nogui'
    }

    data {
		workingDirectory project.file('run/data')
		programArguments.addAll '--mod', 'cardboardboxes', '--all', '--output', file('src/generated/resources/').getAbsolutePath()
	}
}

dependencies {
    implementation 'net.neoforged:neoforge:20.6.22-beta'
}

tasks.named('jar', Jar).configure {
	exclude('com/builtbroken/cardboardboxes/datagen/**') //exclude files from the built jar that are only used to generate the assets & data
    from('/') {
        include 'LICENSE.txt'
    }
    manifest.attributes([
            "Specification-Title": archivesBaseName,
            "Specification-Vendor": "builtbroken",
            "Specification-Version": "1", // We are version 1 of ourselves
            "Implementation-Title": archivesBaseName,
            "Implementation-Version": version,
            "Implementation-Vendor": "builtbroken"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}